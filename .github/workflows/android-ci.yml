name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 37 preview
        run: sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0"

      - name: Compile, test, lint, and assemble
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :core:compileJava :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload APK and validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: driver-assistant-validation
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            core/build/reports/tests/test/**
            core/build/test-results/test/**
          if-no-files-found: warn
          retention-days: 14
